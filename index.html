<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest List Manager</title>
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; background: #f8f9fa; }
        .loader {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; gap: 16px;
        }
        .loader h1 { color: #1a1a2e; margin-bottom: 8px; }
        .spinner {
            width: 40px; height: 40px; border: 3px solid #e0e0e0;
            border-top-color: #1a1a2e; border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader">
        <h1>🎉 Guest List Manager</h1>
        <div class="spinner"></div>
    </div>
</body>
</html>
